name: Python backend checks

on:
  push:
    branches:
      - main
      - feat/whatsapp-voice-image
      - fix/production-readiness-backlog
      - fix/issue-5-internal-webhook-auth
      - fix/whatsapp-render-entrypoint
      - chore/local-development-readiness
      - feat/modern-light-frontend
  pull_request:
    branches:
      - main
      - fix/issue-5-internal-webhook-auth
      - chore/local-development-readiness

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vaidya_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vaidya_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: medical-receptionist
    env:
      ENVIRONMENT: test
      JWT_SECRET: test-only-secret-for-ci-not-production
      DATABASE_URL: sqlite:///./test_ci.db
      WHATSAPP_VERIFY_TOKEN: test-verify
      WHATSAPP_APP_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: medical-receptionist/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run database migrations against clean SQLite
        env:
          DATABASE_URL: sqlite:///./migration_ci.db
        run: alembic upgrade head && alembic current
      - name: Run database migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vaidya_test
        run: alembic upgrade head && alembic current
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run backend and WhatsApp tests
        run: python -m unittest -v test_whatsapp_media test_whatsapp_app test_security test_api test_calendar_service test_agent test_scheduler
