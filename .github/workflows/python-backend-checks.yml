name: Python backend checks

on:
  push:
    branches:
      - main
      - feat/whatsapp-voice-image
      - fix/production-readiness-backlog
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medical-receptionist
    env:
      ENVIRONMENT: test
      JWT_SECRET: test-only-secret-for-ci-not-production
      DATABASE_URL: sqlite:///./test_ci.db
      WHATSAPP_VERIFY_TOKEN: test-verify
      WHATSAPP_APP_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: medical-receptionist/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run backend and WhatsApp tests
        run: python -m unittest -v test_whatsapp_media test_whatsapp_app test_security test_api test_calendar_service
