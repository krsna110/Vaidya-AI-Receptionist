services:
  - type: web
    name: vaidyai-backend
    runtime: python
    rootDir: medical-receptionist
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn whatsapp_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEBHOOK_SHARED_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: CLINIC_TIMEZONE
        value: Asia/Kolkata
      - key: CLINIC_OPEN_TIME
        value: "09:00"
      - key: CLINIC_CLOSE_TIME
        value: "18:00"
      - key: APPOINTMENT_DURATION_MINUTES
        value: "30"
      - key: GOOGLE_CALENDAR_ALLOW_OAUTH_FLOW
        value: "false"

  - type: web
    name: vaidyai-web
    runtime: node
    rootDir: vaidyai-web
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        sync: false
