<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>Vaidya AI · Clinic Dashboard</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#17313a;background:#f7faf9;--muted:#60777b;--line:#dce9e6;--accent:#0f766e;--soft:#e8f5f2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:25px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;gap:11px;align-items:center}.mark{width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}.brand strong{display:block;font-size:18px}.brand span{display:block;color:var(--muted);font-size:12px}.top h1{margin:22px 0 0;font-size:27px;letter-spacing:-.03em}.top p{margin:4px 0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:#fff;color:#17313a;font-weight:650}.btn.primary{color:#fff;background:var(--accent);border-color:var(--accent)}.btn:hover{filter:brightness(.97)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;color:#17313a;outline:none}.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}.toolbar input{min-width:240px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(16,64,65,.05)}.card{padding:17px}.card label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.card strong{display:block;font-size:28px;margin-top:5px}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel h2{font-size:17px;margin:0}.status{font-size:12px;color:var(--muted)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:#f6faf9}th,td{padding:12px;border-bottom:1px solid #edf3f1;white-space:nowrap}td.reason{white-space:normal;min-width:170px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#edf5f3;color:#286b63}.badge.cancelled{background:#fff1ef;color:#a33a32}.badge.local_only,.badge.calendar_sync_failed{background:#fff8e6;color:#8b6817}.empty{text-align:center;color:var(--muted);padding:35px}.notice{margin-bottom:14px;color:#8b6817;background:#fff8e6;border:1px solid #f1dfaa;padding:11px 13px;border-radius:9px;font-size:13px}.mobile-card{display:none}@media(max-width:800px){.wrap{padding:17px 13px}.top{align-items:flex-start;gap:12px}.top h1{font-size:22px}.cards{grid-template-columns:repeat(2,1fr)}.toolbar input{min-width:0;flex:1}.panel{padding:14px}.mobile-card{display:block}.desktop-table{display:none}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand"><div class="mark">V</div><div><strong>Vaidya AI</strong><span>City Dental Clinic · Staff workspace</span></div></div><h1>Today’s overview</h1><p>Appointments and patient scheduling at a glance.</p></div><button class="btn" id="refresh">Refresh</button></header><div id="notice" class="notice" hidden></div><section class="cards"><div class="card"><label>Today's appointments</label><strong id="total">—</strong></div><div class="card"><label>Confirmed</label><strong id="confirmed">—</strong></div><div class="card"><label>Pending</label><strong id="pending">—</strong></div><div class="card"><label>Cancelled</label><strong id="cancelled">—</strong></div></section><section class="panel"><div class="panel-head"><div><h2>Appointments</h2><span class="status" id="updated">Sign in to load clinic data.</span></div></div><div class="toolbar"><input id="search" type="search" placeholder="Search patient or reason" aria-label="Search appointments"><input id="date" type="date" aria-label="Filter by date"><select id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option><option value="confirmed">Confirmed</option><option value="cancelled">Cancelled</option><option value="local_only">Local only</option><option value="calendar_sync_failed">Calendar sync failed</option></select></div><div class="table-wrap desktop-table"><table><thead><tr><th>Time</th><th>Patient</th><th>Reason</th><th>Status</th><th>Calendar</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><div id="mobileRows" class="mobile-card"></div></section></main><script>
let token='',all=[];const $=id=>document.getElementById(id),notice=$('notice');function showError(msg){notice.textContent=msg;notice.hidden=false}async function auth(){const username=prompt('Admin username');const password=prompt('Admin password');if(!username||!password)throw Error('Admin credentials are required');const r=await fetch('/auth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({username,password})});if(!r.ok)throw Error('Authentication failed');token=(await r.json()).access_token}async function load(){const r=await fetch('/appointments',{headers:{Authorization:`Bearer ${token}`}});if(!r.ok)throw Error('Could not load appointments');all=await r.json();render()}function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function render(){const q=$('search').value.toLowerCase(),d=$('date').value,s=$('statusFilter').value;const rows=all.filter(a=>(!q||`${a.patient?.name||a.patient_id||''} ${a.reason||''}`.toLowerCase().includes(q))&&(!d||a.date===d)&&(!s||(a.status||'confirmed')===s));$('total').textContent=rows.length;$('confirmed').textContent=rows.filter(a=>(a.status||'confirmed')==='confirmed'&&a.is_confirmed).length;$('pending').textContent=rows.filter(a=>(a.status||'')==='pending').length;$('cancelled').textContent=rows.filter(a=>a.status==='cancelled'||!a.is_confirmed).length;$('rows').innerHTML='';$('mobileRows').innerHTML='';if(!rows.length){$('rows').innerHTML='<tr><td colspan="6" class="empty">No appointments match this filter.</td></tr>';return}rows.forEach(a=>{const status=a.status||(a.is_confirmed?'confirmed':'cancelled'),cal=a.google_event_id?'Synced':status==='cancelled'?'—':'Local only',tr=document.createElement('tr');tr.innerHTML=`<td>${esc(a.time)}</td><td>${esc(a.patient?.name||`Patient #${a.patient_id??''}`)}</td><td class="reason">${esc(a.reason||a.description)}</td><td><span class="badge ${esc(status)}">${esc(status.replaceAll('_',' '))}</span></td><td>${esc(cal)}</td><td>${status==='confirmed'?`<button class="btn" data-cancel="${a.id}">Cancel</button>`:'—'}</td>`;$('rows').appendChild(tr);const m=document.createElement('article');m.className='card';m.style.marginBottom='10px';m.innerHTML=`<strong style="font-size:16px">${esc(a.time)} · ${esc(a.patient?.name||`Patient #${a.patient_id??''}`)}</strong><div style="color:var(--muted);font-size:13px;margin:7px 0">${esc(a.date)} · ${esc(a.reason||a.description)}</div><span class="badge ${esc(status)}">${esc(status.replaceAll('_',' '))}</span>`;if(status==='confirmed'){const b=document.createElement('button');b.className='btn';b.style.marginTop='10px';b.textContent='Cancel';b.dataset.cancel=a.id;m.appendChild(b)}$('mobileRows').appendChild(m)})}async function cancel(id){if(!confirm('Cancel this appointment?'))return;const r=await fetch(`/appointments/${id}/cancel`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error('Cancellation failed');await load()}document.addEventListener('click',e=>{if(e.target.dataset.cancel)cancel(e.target.dataset.cancel).catch(x=>showError(x.message))});['search','date','statusFilter'].forEach(id=>$(id).addEventListener('input',render));$('refresh').addEventListener('click',()=>load().catch(x=>showError(x.message)));(async()=>{try{await auth();await load();$('updated').textContent=`Updated ${new Date().toLocaleTimeString()}`}catch(e){showError(e.message)}})();
</script></body></html>
